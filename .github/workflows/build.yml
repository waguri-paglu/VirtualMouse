name: Build & Release Virtual Mouse APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found; generating via system gradle..."
            gradle wrapper --gradle-version 8.4 || true
          fi
          chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Locate Built APK
        id: apk
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMouse-APK
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.2.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          name: "Virtual Mouse ${{ steps.release_info.outputs.tag }}"
          tag_name: ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## Virtual Mouse for Rooted Android 🖱️📱
            
            Turn your entire mobile screen into a responsive laptop-style trackpad with a genuine system-wide mouse cursor arrow and full left/right click capabilities.
            
            ### ✨ Features Included:
            - **Native Linux Kernel Pointer**: Powered by `/dev/uinput` for real OS arrow rendering and zero latency.
            - **Full-Screen Trackpad**: The entire screen captures touch motions.
            - **Gesture Controls**:
              - 1-Finger Move: Move mouse cursor.
              - 1-Finger Tap: Left Click (`BTN_LEFT`).
              - 2-Finger Tap: Right Click (`BTN_RIGHT` - context menu/back).
              - 2-Finger Drag: Smooth vertical & horizontal scrolling (`REL_WHEEL`).
              - Long-Press & Drag: Click-and-drag for selection.
            - **Floating Controls**:
              - Dedicated Left ("L") & Right ("R") thumb buttons.
              - Draggable Floating Dock.
              - Quick **MODE** button to toggle between Trackpad and Touch Passthrough without exiting.
            
            ### 📱 Quick Setup:
            1. Install `VirtualMouse-Release.apk` on a rooted Android device (Magisk / KernelSU / APatch).
            2. Grant **Root Access** and **Display over other apps** (Overlay) permission.
            3. Tap **Start Mouse** and enjoy!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
