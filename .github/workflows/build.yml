name: Build & Release Virtual Mouse APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found; generating via system gradle..."
            gradle wrapper --gradle-version 8.4 || true
          fi
          chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Locate Built APK
        id: apk
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          cp "$APK_FILE" app/build/outputs/apk/VirtualMouse-v1.2.0-Release.apk
          echo "Found APK: $APK_FILE"
          echo "apk_path=app/build/outputs/apk/VirtualMouse-v1.2.0-Release.apk" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMouse-v1.2.0-APK
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.2.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          name: "Virtual Mouse ${{ steps.release_info.outputs.tag }} (Material You & Multi-Touch Engine)"
          tag_name: ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## Virtual Mouse v1.2.0 — Material You & Kernel EVIOCGRAB Update 🖱️📱
            
            Turn your entire mobile or tablet display into a zero-latency laptop trackpad powered by Linux `/dev/uinput` and `EVIOCGRAB` kernel touchscreen capture.
            
            ---
            
            ### 🚀 What's New in v1.2.0 (Changelog)
            
            #### 🎨 Material You (Monet) Design & 2-Tab Navigation
            - **Google Pixel / Play Store Aesthetic**: Full Material 3 (`Theme.Material3.DayNight.NoActionBar`) with **Monet Dynamic Wallpaper Colors** (`DynamicColors`) on Android 12+.
            - **Decluttered 2-Tab Layout**: Split into dedicated **Home** and **Settings** tabs via a minimalist bottom navigation bar.
            - **Responsive Mobile & Tablet UI**: Adapts smoothly across portrait phones, foldables, and landscape tablets.
            
            #### 🖐️ New Multi-Touch Trackpad Gestures
            - **1-Finger Hold + 2nd-Finger Drag**: Hold 1 finger on the screen (`>= 90ms`) to lock the **Left Mouse Button (`BTN_LEFT`) down**, and slide with a 2nd finger to drag items, sliders, or text selections effortlessly (supports multi-stroke dragging until the holding finger lifts).
            - **Bi-Directional 3-Finger Tap**: Tap anywhere on the screen with **3 fingers** to instantly swap between **Trackpad Mode** and **Normal Touch Mode** in both directions—even when the floating buttons overlay is hidden.
            - **Zero Conflict with 2-Finger Scroll**: 2-finger smooth wheel scrolling (`REL_WHEEL` / `REL_HWHEEL`) triggers cleanly when two fingers touch down simultaneously and glide together.
            
            #### ⌨️ Quick Settings Tile, Smart Automation & Hideable Overlay
            - **Quick Settings (QS) Toggle Tile**: Start and stop Virtual Mouse from anywhere in a single tap from your notification shade Quick Settings panel.
            - **Auto-Touch on Keyboard (IME)**: Persistent root monitor detects when Android's soft keyboard opens (`dumpsys input_method` / `InputMethod` window state), automatically switches to **Touch Mode (`TOUCH (KB)`)** so you can type immediately, and switches right back to **Trackpad Mode** as soon as the keyboard closes.
            - **Hide Floating Mouse Buttons (`✕`)**: Tap `✕` directly on the floating dock, toggle the switch in **Home / Settings**, or use the **"Show/Hide Buttons"** button in the persistent notification to hide the on-screen buttons completely.
            
            ---
            
            ### 📜 Previous Releases
            - **v1.1.0**: Introduced kernel-level `ioctl(EVIOCGRAB)` touchscreen capture and C JNI loopback UDP datagrams (`127.0.0.1:29876`) to eliminate cursor hiding/teleportation and overlay click blocking.
            - **v1.0.0**: Initial `/dev/uinput` virtual hardware mouse daemon and floating L/R/Mode dock.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
