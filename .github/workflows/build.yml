name: Build & Release Virtual Mouse APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found; generating via system gradle..."
            gradle wrapper --gradle-version 8.4 || true
          fi
          chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease --no-daemon --stacktrace

      - name: Align, Sign & Verify APK Integrity
        id: apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found built APK: $RAW_APK"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          OUT_NAME="VirtualMouse-v1.2.0-build-${{ github.run_number }}.apk"
          OUT_PATH="app/build/outputs/apk/$OUT_NAME"

          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" "$OUT_PATH.aligned"
          "$APKSIGNER" sign             --ks app/vmouse.keystore             --ks-pass pass:vmouse123             --key-pass pass:vmouse123             --ks-key-alias vmouse_key             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$OUT_PATH"             "$OUT_PATH.aligned"
          rm -f "$OUT_PATH.aligned"

          echo "Verifying APK zip structure and V1/V2/V3 signatures..."
          unzip -t "$OUT_PATH" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$OUT_PATH"

          echo "apk_path=$OUT_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$OUT_NAME" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMouse-v1.2.0-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.2.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          name: "Virtual Mouse ${{ steps.release_info.outputs.tag }} (Build #${{ github.run_number }})"
          tag_name: ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## Virtual Mouse v1.2.0 (Build #${{ github.run_number }}) — Material You & Kernel EVIOCGRAB Update 🖱️📱
            
            👉 **Download the latest verified APK**: **`${{ steps.apk.outputs.apk_name }}`**
            
            ---
            
            ### 🚀 What's New in v1.2.0 (Changelog)
            
            #### 🎨 Material You (Monet) Design & 2-Tab Navigation
            - **Google Pixel / Play Store Aesthetic**: Full Material 3 (`Theme.Material3.DayNight.NoActionBar`) with **Monet Dynamic Wallpaper Colors** (`DynamicColors`) on Android 12+.
            - **Decluttered 2-Tab Layout**: Split into dedicated **Home** and **Settings** tabs via a minimalist bottom navigation bar.
            
            #### 🖐️ Multi-Touch Trackpad Gestures
            - **Bi-Directional 1-Finger Hold + 2nd-Finger Drag**: Works regardless of which finger touches first—hold one finger still (`BTN_LEFT=1`) and slide the other finger to drag items, sliders, or text selections.
            - **Smooth 2-Finger Scroll (`REL_WHEEL` + `REL_WHEEL_HI_RES`)**: Slide two fingers together vertically or horizontally to scroll with automatic recovery if one finger slips first.
            - **Bi-Directional 3-Finger Tap**: Tap anywhere with 3 fingers to swap between **Trackpad Mode** and **Normal Touch Mode** in both directions.
            
            #### ⌨️ Quick Settings Tile, Touch Mode Slot Flush & Smart Automation
            - **Quick Settings (QS) Toggle Tile**: Start and stop Virtual Mouse in a single tap from your notification shade.
            - **Clean Touch Mode Transitions**: Flushes multi-touch slots (`ABS_MT_SLOT 0..9 -> -1`) and waits for fingers to lift before toggling `EVIOCGRAB`, preventing stuck ghost fingers or broken Back/Home/Recents/Screenshot gestures.
            - **Auto-Touch on Keyboard (IME)**: Automatically switches to **Touch Mode (`TOUCH (KB)`)** when the keyboard opens and restores **Trackpad Mode** when it closes.
            - **Hide Floating Mouse Buttons (`✕`)**: Hide or restore the on-screen buttons via the `✕` button, Settings, or notification action.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
