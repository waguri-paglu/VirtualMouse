name: Build & Release Arrowroot APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found; generating via system gradle..."
            gradle wrapper --gradle-version 8.4 || true
          fi
          chmod +x gradlew || true

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'vmouse123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'vmouse123' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease --no-daemon --stacktrace

      - name: Align, Sign & Verify APK Integrity
        id: apk
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'vmouse123' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'vmouse123' }}
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found built APK: $RAW_APK"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          OUT_NAME="Arrowroot-v1.3.0-build-${{ github.run_number }}.apk"
          OUT_PATH="app/build/outputs/apk/$OUT_NAME"

          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" "$OUT_PATH.aligned"
          "$APKSIGNER" sign \
            --ks app/vmouse.keystore \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias vmouse_key \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_PATH" \
            "$OUT_PATH.aligned"
          rm -f "$OUT_PATH.aligned"

          echo "Verifying APK zip structure and V1/V2/V3 signatures..."
          unzip -t "$OUT_PATH" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$OUT_PATH"

          echo "apk_path=$OUT_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$OUT_NAME" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arrowroot-v1.3.0-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.3.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          name: "Arrowroot ${{ steps.release_info.outputs.tag }} (Build #${{ github.run_number }})"
          tag_name: ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## Arrowroot v1.3.0 (Build #${{ github.run_number }}) — Rebrand, Security Hardening & Pro UI Overhaul 🏹🌱

            👉 **Download the latest verified APK**: **`${{ steps.apk.outputs.apk_name }}`**

            ---

            ### 🚀 What's New in v1.3.0 (Changelog)

            #### 🏹 Rebranded to **Arrowroot** + Adaptive App Icon
            - **New Brand Identity**: Renamed from *Virtual Mouse* to **Arrowroot** (*Arrow* cursor + *Root* kernel driver) with a custom adaptive launcher icon across all `mipmap-*` densities (`mdpi` to `xxxhdpi` + `anydpi-v26`) and a monochrome vector icon for the Quick Settings tile and status bar.

            #### 🔒 Kernel & IPC Security Hardening
            - **Session-Authenticated Loopback IPC**: Added a per-session 32-bit cryptographic token (`SecureRandom`) shared between `RootMouseController` and `vmouse_daemon` with a mutex-protected JNI socket bridge, preventing unauthorized local apps from injecting mouse events or grabbing the screen.
            - **Eliminated World-Writable `/dev/uinput`**: Removed `chmod 666 /dev/uinput`; the root daemon opens `/dev/uinput` directly with `0700` root-only binary permissions.
            - **Async-Signal-Safe Daemon Shutdown**: Replaced unsafe `cleanup_device()` calls inside the signal handler with a `sig_atomic_t` flag and graceful `SIGTERM` teardown so `EVIOCGRAB` and `/dev/uinput` always release cleanly.

            #### 🎨 Professional Material 3 UI & UX Upgrade
            - **Upgraded Home Dashboard**: Live mode badge (`IDLE`, `TRACKPAD MODE`, `TOUCH MODE`, `TOUCH • KEYBOARD`), one-tap **Swap Mode** and **Center Dock** quick actions, and a 3-column **System Diagnostics** grid (`Superuser`, `Kernel uinput`, `Overlay`).
            - **Refined Floating Overlay Dock**: Persistent dock coordinates across restarts, screen-bounds clamping on rotation, double-tap grip to center, and exact pixel-aligned dock hit zones (`classify_dock_zone`).
            - **Start on Boot & Settings Reset**: Wired up `BootReceiver` to a new **Start on Boot** preference toggle and added one-tap **Reset All Settings to Default**.

            #### 🐛 Bug Fixes
            - Fixed `initImeSensorWindow()` not being invoked in `OverlayService.onCreate()` and cleaned up `imeSensorView` in `onDestroy()` to prevent window leaks.
            - Fixed orphaned root `su` polling shell in `startRootImeMonitor()` by tying its loop to the `vmouse_daemon` PID lifecycle.
            - Fixed cursor jump on 2-finger right-click and 3-finger mode-swap taps when one finger lifts slightly before the others.
            - Fixed `INPUT_PROP_DIRECT` touchscreen selection in `open_touchscreen_device()`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
